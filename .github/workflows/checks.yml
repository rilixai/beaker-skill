name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_version.py --check
      - name: Install matching SDK
        run: |
          sdk_version="$(cat VERSION)"
          python -m pip install "beaker-sdk==${sdk_version}"
      - run: python -m unittest discover -s tests
